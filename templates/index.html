<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        .game-frame { width: 100%; height: 100%; border: none; }
        
        /* FLOATING ADMIN PANEL */
        .admin-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 160px;
            background: rgba(0, 10, 0, 0.95);
            border: 2px solid #00ff41;
            border-radius: 12px;
            padding: 10px;
            z-index: 9999;
            box-shadow: 0 0 20px #00ff41;
            color: #00ff41;
            touch-action: none;
        }

        .input-box {
            background: #000; border: 1px solid #00ff41; color: #fff;
            width: 100%; text-align: center; font-size: 12px;
            padding: 5px; margin: 5px 0; outline: none;
        }

        .btn-main {
            background: #00ff41; color: #000; width: 100%;
            font-weight: 900; font-size: 10px; padding: 10px;
            text-transform: uppercase; border-radius: 4px; cursor: pointer;
        }

        .res-zone {
            margin-top: 10px; border-top: 1px solid #00ff41;
            padding-top: 10px; text-align: center;
        }

        .num-xl { font-size: 3rem; font-weight: 900; color: #fff; line-height: 1; }
        .blink { animation: flash 1s infinite; }
        @keyframes flash { 50% { opacity: 0.2; } }
        
        select { background: #000; color: #00ff41; border: 1px solid #00ff41; font-size: 9px; width: 100%; margin-bottom: 5px; }
        .sync-btn { font-size: 7px; text-decoration: underline; opacity: 0.5; margin-top: 5px; display: block; text-align: center; }
    </style>
</head>
<body>

    <!-- THE WEBSITE LAYER -->
    <iframe id="gameSite" src="https://maanwin.site/home/all/wingo" class="game-frame"></iframe>

    <!-- THE FLOATING ADMIN PANEL -->
    <div class="admin-panel" id="dragPanel">
        <div class="flex justify-between items-center text-[7px] font-bold">
            <span id="status" class="text-red-500 blink uppercase">● UNSYNCED</span>
            <span>APEX_V28</span>
        </div>

        <select id="siteSwitch" onchange="changeSite()">
            <option value="https://maanwin.site/home/all/wingo">MAANWIN</option>
            <option value="https://dmwin.app/">DMWIN</option>
            <option value="https://jaiclub.com/">JAI CLUB</option>
            <option value="https://yaarwin.com/">YAARWIN</option>
        </select>

        <input type="number" id="periodInput" class="input-box" placeholder="PERIOD NO.">
        
        <button onclick="extractResult()" class="btn-main">EXTRACT RESULT</button>

        <div id="resultBox" class="hidden res-zone space-y-1">
            <div id="resNum" class="num-xl italic">--</div>
            <div id="resColor" class="text-[10px] font-black tracking-[0.3rem]">--</div>
            <div id="resSize" class="text-[8px] font-bold opacity-60">--</div>
            <div class="text-[6px] text-black bg-green-400 font-bold px-1 uppercase mt-2">100% Locked</div>
        </div>

        <span onclick="showSync()" class="sync-btn">CALIBRATE SERVER LINK</span>
    </div>

    <!-- CALIBRATION MODAL -->
    <div id="syncModal" class="hidden absolute inset-0 bg-black/90 z-[10000] flex items-center justify-center p-6">
        <div class="text-center space-y-4 border border-green-500 p-6 rounded-lg">
            <div class="text-xs">INPUT LAST WINNING NUMBER</div>
            <input type="number" id="lastP" class="input-box" placeholder="Last Period">
            <input type="number" id="lastN" class="input-box" placeholder="Last Number">
            <button onclick="runSync()" class="btn-main">SYNC NOW</button>
        </div>
    </div>

    <script>
        function changeSite() { document.getElementById('gameSite').src = document.getElementById('siteSwitch').value; }
        function showSync() { document.getElementById('syncModal').classList.remove('hidden'); }

        async function runSync() {
            const p = document.getElementById('lastP').value;
            const n = document.getElementById('lastN').value;
            await fetch(`/calibrate?period=${p}&num=${n}`);
            document.getElementById('syncModal').classList.add('hidden');
            document.getElementById('status').innerText = "● SYNCED 100%";
            document.getElementById('status').className = "text-green-500 uppercase";
        }

        async function extractResult() {
            const period = document.getElementById('periodInput').value;
            if(!period) return;
            const res = await fetch(`/extract?period=${period}`);
            const data = await res.json();
            
            document.getElementById('resultBox').classList.remove('hidden');
            document.getElementById('resNum').innerText = data.number;
            document.getElementById('resColor').innerText = data.color;
            document.getElementById('resColor').style.color = data.color.includes("GREEN") ? "#26a69a" : "#ef5350";
            document.getElementById('resSize').innerText = "RESULT: " + data.size;
        }

        // DRAGGABLE LOGIC
        const panel = document.getElementById('dragPanel');
        let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        panel.addEventListener("touchstart", (e) => {
            initialX = e.touches[0].clientX - xOffset; initialY = e.touches[0].clientY - yOffset;
            if (e.target === panel || panel.contains(e.target)) active = true;
        }, false);
        panel.addEventListener("touchend", () => { initialX = currentX; initialY = currentY; active = false; }, false);
        panel.addEventListener("touchmove", (e) => {
            if (active) {
                e.preventDefault();
                currentX = e.touches[0].clientX - initialX; currentY = e.touches[0].clientY - initialY;
                xOffset = currentX; yOffset = currentY;
                panel.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }, false);
    </script>
</body>
</html>
